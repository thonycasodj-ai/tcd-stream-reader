<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCD Stream Reader</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Bebas+Neue&display=swap');

  :root{
    --navy-deep: #050714;
    --purple: #7b2ff7;
    --gold: #f5b942;
    --gold-soft: #ffd97a;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background: var(--navy-deep);
    font-family: 'Space Grotesk', sans-serif;
    color: #fff;
    min-height: 100vh;
    padding: 20px;
  }
  .wrap{ max-width: 560px; margin: 0 auto; }
  .brand{
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .brand .dot{ width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); }
  .dot.live{ background: #ff4d4d; box-shadow: 0 0 10px #ff4d4d; animation: blink 1.2s infinite; }
  @keyframes blink{ 50%{ opacity: 0.3; } }
  .sub{ font-size: 12px; color: rgba(255,255,255,0.5); letter-spacing: 1px; margin-bottom: 20px; text-transform: uppercase; }

  .panel{
    background: linear-gradient(160deg, rgba(123,47,247,0.12), rgba(245,185,66,0.05));
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .status-row{ display:flex; align-items:center; gap:8px; font-size:12px; color: rgba(255,255,255,0.6); margin-bottom: 12px; }

  .now-reading{
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 10px;
  }
  .avatar-pulse{
    width: 54px; height: 54px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--gold-soft), var(--purple));
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .avatar-pulse.speaking{ animation: pulseRing 1s ease-out infinite; }
  @keyframes pulseRing{
    0%{ box-shadow: 0 0 0 0 rgba(245,185,66,0.55); }
    70%{ box-shadow: 0 0 0 18px rgba(245,185,66,0); }
    100%{ box-shadow: 0 0 0 0 rgba(245,185,66,0); }
  }
  .reading-text{ font-size: 15px; min-height: 22px; }
  .reading-user{ font-size: 11px; color: var(--gold-soft); letter-spacing: 1px; text-transform: uppercase; }
  .idle-text{ color: rgba(255,255,255,0.35); font-size: 13px; }

  label{ display:block; font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
  input[type=text]{
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px;
    padding: 11px 12px;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    margin-bottom: 12px;
  }
  input::placeholder{ color: rgba(255,255,255,0.35); }

  .btn{
    width: 100%;
    background: linear-gradient(135deg, var(--gold), var(--gold-soft));
    color: #1a1a2e;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.5px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .btn.stop{ background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.2); }

  .queue-label{ font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 8px; }
  .queue-list{ display: flex; flex-direction: column; gap: 6px; max-height: 160px; overflow-y: auto; }
  .queue-item{ background: rgba(255,255,255,0.05); border-left: 2px solid var(--purple); padding: 8px 10px; border-radius: 6px; font-size: 12.5px; color: rgba(255,255,255,0.75); }
  .queue-item b{ color: var(--gold-soft); }
  .queue-item.gift{ border-left-color: var(--gold); }
  .empty-queue{ font-size: 12px; color: rgba(255,255,255,0.3); padding: 6px 2px; }

  .footnote{ font-size: 10.5px; color: rgba(255,255,255,0.35); text-align: center; margin-top: 6px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot" id="liveDot"></span>TCD STREAM READER</div>
  <div class="sub">Collegato alla tua chat live TikTok</div>

  <div class="panel">
    <div class="status-row" id="statusRow">Non collegato</div>
    <label>Username TikTok (senza @)</label>
    <input type="text" id="usernameInput" placeholder="es. thonycasodj">
    <button class="btn" id="connectBtn" onclick="toggleConnect()">Collega alla live</button>
  </div>

  <div class="panel">
    <div class="now-reading">
      <div class="avatar-pulse" id="avatarPulse">🎙️</div>
      <div class="reading-user" id="readingUser"></div>
      <div class="reading-text idle-text" id="readingText">In attesa di commenti...</div>
    </div>
  </div>

  <div class="panel">
    <div class="queue-label">Ultimi eventi</div>
    <div class="queue-list" id="queueList">
      <div class="empty-queue">Nessun evento ancora</div>
    </div>
  </div>

  <div class="footnote">
    Apri questa pagina su telefono o come Browser Source in OBS mentre sei live.<br>
    Deve restare aperta per continuare a leggere i commenti.
  </div>
</div>

<script>
  let ws = null;
  let connected = false;
  let speechQueue = [];
  let speaking = false;
  let history = [];

  function connectWebSocket(){
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}`);

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if(data.type === 'status'){
        connected = data.status === 'connected';
        updateStatus(data);
      }

      if(data.type === 'chat'){
        addHistory(data.user, data.text, false);
        speechQueue.push(`${data.user} dice: ${data.text}`);
        processSpeechQueue();
      }

      if(data.type === 'gift'){
        const label = `${data.giftName} x${data.repeatCount}`;
        addHistory(data.user, label, true);
        speechQueue.push(`${data.user} ha inviato ${data.giftName}`);
        processSpeechQueue();
      }
    };
  }

  function updateStatus(data){
    const row = document.getElementById('statusRow');
    const dot = document.getElementById('liveDot');
    const btn = document.getElementById('connectBtn');
    if(data.status === 'connected'){
      row.textContent = `Collegato a @${data.username}`;
      dot.classList.add('live');
      btn.textContent = 'Disconnetti';
    } else {
      row.textContent = 'Non collegato';
      dot.classList.remove('live');
      btn.textContent = 'Collega alla live';
    }
  }

  async function toggleConnect(){
    if(connected){
      await fetch('/api/disconnect', { method: 'POST' });
      return;
    }
    const username = document.getElementById('usernameInput').value.trim();
    if(!username) return alert('Inserisci il tuo username TikTok');

    const res = await fetch('/api/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username })
    });
    const data = await res.json();
    if(!res.ok){
      alert(data.error || 'Errore di connessione');
    }
  }

  function addHistory(user, text, isGift){
    history.unshift({ user, text, isGift });
    history = history.slice(0, 20);
    const list = document.getElementById('queueList');
    if(history.length === 0){
      list.innerHTML = '<div class="empty-queue">Nessun evento ancora</div>';
      return;
    }
    list.innerHTML = history.map(item =>
      `<div class="queue-item ${item.isGift ? 'gift' : ''}"><b>${item.user}${item.isGift ? ' 🎁' : ''}:</b> ${item.text}</div>`
    ).join('');
  }

  // Riconosce la lingua guardando i caratteri usati nel messaggio,
  // così la voce legge con la pronuncia giusta invece che sempre in italiano.
  function detectLanguage(text){
    if(/[\u3040-\u30ff\u31f0-\u31ff]/.test(text)) return 'ja-JP';       // Giapponese (hiragana/katakana)
    if(/[\uac00-\ud7af]/.test(text)) return 'ko-KR';                    // Coreano
    if(/[\u4e00-\u9fff]/.test(text)) return 'zh-CN';                    // Cinese (kanji/hanzi senza kana)
    if(/[\u0600-\u06ff]/.test(text)) return 'ar-SA';                    // Arabo
    if(/[\u0400-\u04ff]/.test(text)) return 'ru-RU';                    // Russo/cirillico
    if(/[\u0e00-\u0e7f]/.test(text)) return 'th-TH';                    // Thai
    if(/[àèéìòùçñ]/i.test(text) && /\b(el|la|los|las|que|para|muy)\b/i.test(text)) return 'es-ES'; // Spagnolo
    if(/\b(le|la|les|est|pas|avec|pour|bonjour)\b/i.test(text)) return 'fr-FR'; // Francese
    if(/\b(the|you|is|are|and|thanks|love)\b/i.test(text)) return 'en-US'; // Inglese
    return 'it-IT'; // Default italiano
  }

  function processSpeechQueue(){
    if(speaking || speechQueue.length === 0) return;
    speaking = true;
    const text = speechQueue.shift();

    const readingText = document.getElementById('readingText');
    readingText.textContent = text;
    readingText.classList.remove('idle-text');
    document.getElementById('avatarPulse').classList.add('speaking');

    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = detectLanguage(text);
    utter.rate = 1.05;

    utter.onend = () => {
      speaking = false;
      document.getElementById('avatarPulse').classList.remove('speaking');
      if(speechQueue.length === 0){
        readingText.textContent = 'In attesa di commenti...';
        readingText.classList.add('idle-text');
      }
      processSpeechQueue();
    };

    speechSynthesis.speak(utter);
  }

  connectWebSocket();
</script>
</body>
</html>
