<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCD Stream Reader</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Bebas+Neue&display=swap');

  :root{
    --navy-deep: #050714;
    --navy: #0a0e27;
    --purple: #7b2ff7;
    --gold: #f5b942;
    --gold-soft: #ffd97a;
    --coral: #ff5f7e;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background: var(--navy-deep);
    font-family: 'Space Grotesk', sans-serif;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  .bg-glow{
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 0%, rgba(123,47,247,0.25), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(245,185,66,0.18), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(255,95,126,0.12), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  .bg-grid{
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 34px 34px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap{ max-width: 600px; margin: 0 auto; padding: 22px 18px 40px; position: relative; z-index: 1; }

  .hero{ text-align: center; padding: 18px 0 24px; }
  .hero-badge{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    font-size: 10.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    margin-bottom: 14px;
  }
  .live-dot{ width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.3); }
  .live-dot.on{ background: var(--coral); box-shadow: 0 0 8px var(--coral); animation: blink 1.1s infinite; }
  @keyframes blink{ 50%{ opacity: 0.35; } }

  .hero h1{
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 3px;
    line-height: 1;
    background: linear-gradient(135deg, #fff 30%, var(--gold-soft) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero p{ font-size: 12.5px; color: rgba(255,255,255,0.45); letter-spacing: 0.5px; margin-top: 6px; }

  .stage-card{
    position: relative;
    border-radius: 26px;
    padding: 32px 20px 26px;
    margin-bottom: 18px;
    background: linear-gradient(165deg, rgba(123,47,247,0.16), rgba(5,7,20,0.4) 60%);
    border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden;
    text-align: center;
  }
  .stage-card::before{
    content:'';
    position: absolute;
    top: -50%; left: 50%;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(245,185,66,0.18), transparent 65%);
    transform: translateX(-50%);
    pointer-events: none;
  }

  .avatar-orb{
    position: relative;
    width: 96px; height: 96px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-soft), var(--purple) 75%);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    box-shadow: 0 0 0 0 rgba(245,185,66,0.5);
  }
  .avatar-orb.speaking{ animation: orbPulse 0.9s ease-out infinite; }
  @keyframes orbPulse{
    0%{ box-shadow: 0 0 0 0 rgba(245,185,66,0.5); }
    70%{ box-shadow: 0 0 0 22px rgba(245,185,66,0); }
    100%{ box-shadow: 0 0 0 0 rgba(245,185,66,0); }
  }
  .avatar-ring{ position: absolute; inset: -8px; border-radius: 50%; border: 2px solid rgba(245,185,66,0.3); }

  .reading-user{
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--gold-soft); min-height: 16px; margin-bottom: 4px;
  }
  .reading-text{ font-size: 17px; font-weight: 500; min-height: 26px; line-height: 1.4; padding: 0 6px; }
  .reading-text.idle{ color: rgba(255,255,255,0.3); font-size: 13.5px; font-weight: 400; }

  .panel{
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 16px;
  }
  label{
    display:block; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: rgba(255,255,255,0.4); margin-bottom: 7px;
  }
  .input-row{ display: flex; gap: 10px; }
  input[type=text]{
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 13px 14px;
    color: #fff;
    font-family: inherit;
    font-size: 14.5px;
  }
  input::placeholder{ color: rgba(255,255,255,0.3); }

  .btn{
    border: none; border-radius: 12px; padding: 13px 22px;
    font-family: inherit; font-weight: 700; font-size: 12.5px;
    letter-spacing: 0.8px; text-transform: uppercase; cursor: pointer;
    white-space: nowrap; transition: transform 0.12s ease;
    background: linear-gradient(135deg, var(--gold), var(--gold-soft));
    color: #1a1226;
  }
  .btn:active{ transform: scale(0.96); }
  .btn.on{ background: linear-gradient(135deg, var(--coral), #ff8fa3); color: #2a0d16; }

  .feed-label{
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: rgba(255,255,255,0.4); margin-bottom: 10px; display: flex; justify-content: space-between;
  }
  .feed{ display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; }
  .feed::-webkit-scrollbar{ width: 4px; }
  .feed::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.15); border-radius: 4px; }

  .bubble{
    background: rgba(255,255,255,0.05);
    border-radius: 14px;
    padding: 10px 13px;
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    border-left: 3px solid var(--purple);
    animation: bubbleIn 0.3s ease;
  }
  .bubble b{ color: var(--gold-soft); }
  .bubble.gift{
    border-left-color: var(--gold);
    background: linear-gradient(90deg, rgba(245,185,66,0.1), rgba(255,255,255,0.04));
  }
  .bubble.join{
    border-left-color: #4ade80;
    color: rgba(255,255,255,0.55);
    font-size: 12px;
  }
  @keyframes bubbleIn{ from{ opacity: 0; transform: translateY(6px); } to{ opacity: 1; transform: translateY(0); } }
  .empty-feed{ font-size: 12px; color: rgba(255,255,255,0.25); padding: 4px 2px; }

  .footnote{ text-align: center; font-size: 10.5px; color: rgba(255,255,255,0.3); margin-top: 18px; line-height: 1.6; }

  .powered-by{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .powered-by span{
    font-size: 10px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
  }
  .powered-by .mark{
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--gold-soft), var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="bg-grid"></div>

<div class="wrap">

  <div class="hero">
    <div class="hero-badge"><span class="live-dot" id="liveDot"></span><span id="statusText">Non collegato</span></div>
    <h1>STREAM READER</h1>
    <p>La tua chat live, letta ad alta voce</p>
  </div>

  <div class="stage-card">
    <div class="avatar-orb" id="avatarOrb">
      <div class="avatar-ring"></div>
      🎙️
    </div>
    <div class="reading-user" id="readingUser"></div>
    <div class="reading-text idle" id="readingText">In attesa di commenti...</div>
  </div>

  <div class="panel">
    <label>Username TikTok (senza @)</label>
    <div class="input-row">
      <input type="text" id="usernameInput" placeholder="es. thonycasodj">
      <button class="btn" id="connectBtn" onclick="toggleConnect()">Collega</button>
    </div>
  </div>

  <div class="panel">
    <div class="feed-label"><span>Ultimi eventi</span><span id="eventCount"></span></div>
    <div class="feed" id="feed">
      <div class="empty-feed">Nessun evento ancora</div>
    </div>
  </div>

  <div class="footnote">
    Apri questa pagina su telefono o come Browser Source in OBS mentre sei live.<br>
    Deve restare aperta per continuare a leggere i commenti.
  </div>
  <div class="powered-by">
    <span>Powered by</span>
    <span class="mark">TCD</span>
  </div>
</div>

<script>
  let ws = null;
  let connected = false;
  let speechQueue = [];
  let speaking = false;
  let history = [];
  let lastJoinAnnounce = 0;

  function connectWebSocket(){
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}`);

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if(data.type === 'status'){
        connected = data.status === 'connected';
        updateStatus(data);
      }
      if(data.type === 'chat'){
        addToFeed(data.user, data.text, false);
        speechQueue.push(`${data.user} dice: ${data.text}`);
        processSpeechQueue();
      }
      if(data.type === 'gift'){
        const label = `${data.giftName} x${data.repeatCount}`;
        addToFeed(data.user, label, true);
        speechQueue.push(`${data.user} ha inviato ${data.giftName}`);
        processSpeechQueue();
      }
      if(data.type === 'join'){
        addToFeed(data.user, 'è entrato in diretta', false, true);
        const now = Date.now();
        if(now - lastJoinAnnounce > 8000){
          lastJoinAnnounce = now;
          speechQueue.push(`${data.user} è entrato in diretta`);
          processSpeechQueue();
        }
      }
    };
  }

  function updateStatus(data){
    const dot = document.getElementById('liveDot');
    const statusText = document.getElementById('statusText');
    const btn = document.getElementById('connectBtn');
    if(data.status === 'connected'){
      statusText.textContent = `Collegato a @${data.username}`;
      dot.classList.add('on');
      btn.textContent = 'Disconnetti';
      btn.classList.add('on');
    } else {
      statusText.textContent = 'Non collegato';
      dot.classList.remove('on');
      btn.textContent = 'Collega';
      btn.classList.remove('on');
    }
  }

  async function toggleConnect(){
    if(connected){
      await fetch('/api/disconnect', { method: 'POST' });
      return;
    }
    const username = document.getElementById('usernameInput').value.trim();
    if(!username) return alert('Inserisci il tuo username TikTok');

    const res = await fetch('/api/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username })
    });
    const data = await res.json();
    if(!res.ok) alert(data.error || 'Errore di connessione');
  }

  function addToFeed(user, text, isGift, isJoin){
    history.unshift({ user, text, isGift, isJoin });
    history = history.slice(0, 25);
    const feed = document.getElementById('feed');
    document.getElementById('eventCount').textContent = history.length ? `${history.length}` : '';
    if(history.length === 0){
      feed.innerHTML = '<div class="empty-feed">Nessun evento ancora</div>';
      return;
    }
    feed.innerHTML = history.map(item => {
      const cls = item.isGift ? 'gift' : (item.isJoin ? 'join' : '');
      const icon = item.isGift ? ' 🎁' : (item.isJoin ? ' 👋' : '');
      return `<div class="bubble ${cls}"><b>${item.user}${icon}</b> ${item.text}</div>`;
    }).join('');
  }

  function detectLanguage(text){
    if(/[\u3040-\u30ff\u31f0-\u31ff]/.test(text)) return 'ja-JP';
    if(/[\uac00-\ud7af]/.test(text)) return 'ko-KR';
    if(/[\u4e00-\u9fff]/.test(text)) return 'zh-CN';
    if(/[\u0600-\u06ff]/.test(text)) return 'ar-SA';
    if(/[\u0400-\u04ff]/.test(text)) return 'ru-RU';
    if(/[\u0e00-\u0e7f]/.test(text)) return 'th-TH';
    if(/[àèéìòùçñ]/i.test(text) && /\b(el|la|los|las|que|para|muy)\b/i.test(text)) return 'es-ES';
    if(/\b(le|la|les|est|pas|avec|pour|bonjour)\b/i.test(text)) return 'fr-FR';
    if(/\b(the|you|is|are|and|thanks|love)\b/i.test(text)) return 'en-US';
    return 'it-IT';
  }

  function speakWithBrowser(text, onDone){
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = detectLanguage(text);
    utter.rate = 1.05;
    utter.onend = onDone;
    utter.onerror = onDone;
    speechSynthesis.speak(utter);
  }

  async function processSpeechQueue(){
    if(speaking || speechQueue.length === 0) return;
    speaking = true;
    const text = speechQueue.shift();

    const readingText = document.getElementById('readingText');
    readingText.textContent = text;
    readingText.classList.remove('idle');
    document.getElementById('avatarOrb').classList.add('speaking');

    const finish = () => {
      speaking = false;
      document.getElementById('avatarOrb').classList.remove('speaking');
      if(speechQueue.length === 0){
        readingText.textContent = 'In attesa di commenti...';
        readingText.classList.add('idle');
      }
      processSpeechQueue();
    };

    try {
      const res = await fetch('/api/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      if(!res.ok) throw new Error('tts non disponibile');

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.onended = () => { URL.revokeObjectURL(url); finish(); };
      audio.onerror = () => { URL.revokeObjectURL(url); speakWithBrowser(text, finish); };
      audio.play();
    } catch(e){
      // Voce di riserva (browser) se ElevenLabs non risponde
      speakWithBrowser(text, finish);
    }
  }

  connectWebSocket();
</script>
</body>
</html>
